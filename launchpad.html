<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Launchpad focus tools</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;500;700&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
<style>
/* VOICE: terse HUD readouts, encouraging but cool - a tool you want to look at
   IDEA: a cyberpunk heads-up display; the timer is a glowing reactor dial, the step is a mission objective
   PICTURE: the lime wedge of remaining time glowing inside a segmented bezel, filling its own page
   COLOUR and TYPE: black and graphite fields, lime #c6ff00 accent with glow, one hot magenta for alerts; Chakra Petch + Rajdhani
   LAYOUT: sticky tab bar; Timer page = dial centred and huge; Breakdown page = objective card then step log */
:root{color-scheme:dark;--bg:#07080a;--panel:#111316;--panel2:#181b1f;--line:#2a2f35;--ink:#e8ece6;--muted:#8a929a;--lime:#c6ff00;--lime2:#8fbf00;--glow:0 0 6px rgba(198,255,0,.55),0 0 22px rgba(198,255,0,.25);--hot:#ff2e88}
*{box-sizing:border-box;min-width:0}
html{scroll-padding-top:72px}
body{margin:0;min-height:100vh;background:var(--bg);color:var(--ink);font:17px/1.5 Rajdhani,system-ui,sans-serif;font-weight:500;overflow-x:clip;
  background-image:linear-gradient(rgba(198,255,0,.035) 1px,transparent 1px),linear-gradient(90deg,rgba(198,255,0,.035) 1px,transparent 1px),radial-gradient(ellipse at 50% -10%,#1a2208 0%,transparent 60%);
  background-size:40px 40px,40px 40px,100% 100%}
body::after{content:"";position:fixed;inset:0;pointer-events:none;background:repeating-linear-gradient(0deg,rgba(0,0,0,.22) 0 1px,transparent 1px 3px);z-index:50}
.wrap{max-width:1000px;margin:0 auto;padding:0 max(4vw,16px)}

/* top bar + tabs */
.top{position:sticky;top:0;z-index:20;background:rgba(7,8,10,.88);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:12px;justify-content:space-between;flex-wrap:wrap;padding-block:10px}
.brand{font:700 22px/1 "Chakra Petch",sans-serif;letter-spacing:.06em;color:var(--lime);text-shadow:var(--glow);white-space:nowrap}
.brand span{color:var(--muted);font-weight:400;text-shadow:none}
nav{display:flex;gap:6px}
nav a{display:flex;align-items:center;gap:8px;min-height:44px;padding:0 18px;color:var(--muted);text-decoration:none;font:700 15px/1 "Chakra Petch",sans-serif;letter-spacing:.08em;text-transform:uppercase;border:1px solid var(--line);background:var(--panel);
  clip-path:polygon(10px 0,100% 0,100% calc(100% - 10px),calc(100% - 10px) 100%,0 100%,0 10px)}
nav a[aria-current=page]{color:#000;background:var(--lime);border-color:var(--lime);box-shadow:var(--glow)}
nav a:focus-visible{outline:2px solid var(--lime);outline-offset:3px}
.mini{font-variant-numeric:tabular-nums;color:var(--lime)}
nav a[aria-current=page] .mini{color:#000}

.view{padding-block:clamp(20px,4vw,44px) 56px}
.view[hidden]{display:none}
h1{font:700 clamp(30px,5vw,44px)/1.05 "Chakra Petch",sans-serif;margin:0 0 6px;text-wrap:balance;text-transform:uppercase;letter-spacing:.03em}
.sub{color:var(--muted);margin:0 0 22px}

/* timer page */
.tgrid{display:grid;justify-items:center;text-align:center}
.face{position:relative;width:min(100%,520px,62vh);aspect-ratio:1}
.face svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
#wedge{fill:var(--lime);filter:drop-shadow(0 0 6px rgba(198,255,0,.7)) drop-shadow(0 0 18px rgba(198,255,0,.35))}
.face.done #wedge{animation:pulse .9s ease-in-out 5}
.face.done .bezel{stroke:var(--hot)}
@keyframes pulse{50%{opacity:.2}}
@media(prefers-reduced-motion:reduce){.face.done #wedge{animation:none}}
.readout{font:700 clamp(52px,11vw,88px)/1 "Chakra Petch",sans-serif;font-variant-numeric:tabular-nums;color:var(--lime);text-shadow:var(--glow);margin:14px 0 4px;white-space:nowrap}
.tlabel{color:var(--muted);min-height:1.5em;margin:0 0 16px;max-width:36ch;overflow-wrap:anywhere;font-size:18px}
.tlabel b{color:var(--ink)}
.row{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}

/* controls */
button,input{font:inherit;color:inherit}
button{min-height:44px;padding:0 18px;border:1px solid var(--line);background:var(--panel2);cursor:pointer;font:700 15px/1 "Chakra Petch",sans-serif;letter-spacing:.06em;text-transform:uppercase;color:var(--ink);
  clip-path:polygon(8px 0,100% 0,100% calc(100% - 8px),calc(100% - 8px) 100%,0 100%,0 8px);transition:background .15s,color .15s}
button:hover{border-color:var(--lime);color:var(--lime)}
button:focus-visible,input:focus-visible{outline:2px solid var(--lime);outline-offset:3px}
button.primary{background:var(--lime);color:#000;border-color:var(--lime);min-width:140px;box-shadow:var(--glow)}
button.primary:hover{background:#d9ff4d;color:#000}
button.on{border-color:var(--lime);color:var(--lime);box-shadow:inset 0 0 0 1px var(--lime)}
button.small{min-height:38px;padding:0 12px;font-size:13px}
button:disabled{opacity:.5;cursor:wait}
input[type=text],input[type=number]{min-height:46px;padding:0 14px;border:1px solid var(--line);background:#0b0d0f;font:500 17px Rajdhani,sans-serif;width:100%;color:var(--ink)}
input::placeholder{color:#5d656c}
input[type=text]:focus,input[type=number]:focus{border-color:var(--lime)}
input[type=number]{width:90px;text-align:center}
label{font:700 14px "Chakra Petch",sans-serif;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.custom{display:flex;align-items:center;gap:10px;justify-content:center;margin-top:12px;flex-wrap:wrap}
.custom span{color:var(--muted)}

/* breakdown page */
.panel{background:linear-gradient(180deg,var(--panel),#0c0e10);border:1px solid var(--line);padding:clamp(16px,3vw,24px);margin-bottom:20px;position:relative;
  clip-path:polygon(16px 0,100% 0,100% calc(100% - 16px),calc(100% - 16px) 100%,0 100%,0 16px)}
form{display:grid;gap:12px}
.slider{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center}
input[type=range]{accent-color:var(--lime);width:100%;height:44px}
.lvl{font:700 15px "Chakra Petch",sans-serif;color:var(--lime);white-space:nowrap;min-width:8.5em;text-align:right;text-transform:uppercase}
.status{font-size:15px;color:var(--muted);min-height:1.5em;margin:0}
.status.busy{color:var(--lime)}
.obj{border-color:var(--lime2);box-shadow:inset 0 0 40px rgba(198,255,0,.06)}
.obj::before{content:"";position:absolute;left:0;top:16px;bottom:0;width:4px;background:var(--lime);box-shadow:var(--glow)}
.obj .k{font:700 13px "Chakra Petch",sans-serif;letter-spacing:.1em;text-transform:uppercase;color:var(--lime);margin:0 0 6px}
.obj .k span{color:var(--muted)}
.obj .now{font:700 clamp(24px,4vw,32px)/1.15 "Chakra Petch",sans-serif;margin:0 0 16px;overflow-wrap:anywhere}
.obj .row{justify-content:flex-start}
.obj.empty{border-color:var(--line)}.obj.empty::before{background:var(--line);box-shadow:none}.obj.empty .k{color:var(--muted)}
.bar{height:6px;background:#1d2126;margin:0 0 16px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--lime);box-shadow:var(--glow);transition:width .3s}
h2{font:700 15px "Chakra Petch",sans-serif;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin:0 0 8px}
ol{list-style:none;padding:0;margin:0;counter-reset:s}
li{display:grid;grid-template-columns:44px minmax(0,1fr) auto;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
li .chk{width:36px;height:36px;min-height:36px;padding:0;font-size:16px}
li.done .chk{background:var(--lime);color:#000;border-color:var(--lime)}
li.done .txt{text-decoration:line-through;color:#5d656c}
li.cur .txt{color:var(--lime)}
.txt small{color:var(--muted);white-space:nowrap;margin-left:8px;font-family:"Chakra Petch",sans-serif;font-size:13px}
.acts{display:flex;gap:6px}
.steptxt{all:unset;cursor:pointer;display:block;padding:6px 0;font:500 17px/1.35 Rajdhani,sans-serif;overflow-wrap:anywhere}
.steptxt:hover{color:var(--lime)}
.steptxt:focus-visible{outline:2px solid var(--lime);outline-offset:3px}
.linked{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin:0 0 16px}
.linked[hidden]{display:none}
.add{display:flex;gap:10px;margin-top:14px}
.add input{flex:1}
.note{font-size:14px;color:var(--muted);margin:12px 0 0}
@media(max-width:600px){.top .wrap{justify-content:center}.slider{grid-template-columns:minmax(0,1fr) auto}.slider label{grid-column:1/-1}li{grid-template-columns:40px minmax(0,1fr)}.acts{grid-column:2}}
</style>
</head>
<body>
<header class="top">
  <div class="wrap">
    <div class="brand">LAUNCHPAD<span> //</span></div>
    <nav aria-label="Pages">
      <a href="#timer" id="tabT">Timer <span class="mini" id="miniT"></span></a>
      <a href="#breakdown" id="tabB">Breakdown</a>
    </nav>
  </div>
</header>

<main class="wrap">
  <section class="view" id="vTimer" aria-labelledby="th">
    <div class="tgrid">
      <h1 id="th">Focus timer</h1>
      <p class="sub">Watch the green drain. That's all you have to do.</p>
      <div class="face" id="face">
        <svg id="dial" viewBox="-30 -30 260 260" role="img" aria-label="Visual timer dial">
          <defs>
            <radialGradient id="core" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#161a10"/><stop offset="1" stop-color="#0a0b0c"/></radialGradient>
          </defs>
          <circle cx="100" cy="100" r="118" fill="none" stroke="#1d2126" stroke-width="1"/>
          <circle class="bezel" cx="100" cy="100" r="112" fill="none" stroke="#2a2f35" stroke-width="3" stroke-dasharray="14 6"/>
          <circle cx="100" cy="100" r="94" fill="url(#core)" stroke="#2a2f35" stroke-width="1"/>
          <g id="ticks"></g>
          <path id="wedge"/>
          <circle cx="100" cy="100" r="30" fill="#07080a" stroke="#2a2f35"/>
          <circle cx="100" cy="100" r="6" fill="var(--lime)"/>
        </svg>
      </div>
      <div class="readout" id="readout">25:00</div>
      <p class="tlabel" id="tlabel"></p>
      <div class="linked" id="linked" hidden><button class="small" id="ldone">✓ Step done, next step</button><button class="small" id="lback">Back to steps</button></div>
      <div class="row">
        <button class="primary" id="go">Start</button>
        <button id="reset">Reset</button>
      </div>
      <div class="row" id="presets" style="margin-top:12px"></div>
      <div class="custom">
        <label for="mins">Custom</label>
        <input type="number" id="mins" min="1" max="240" value="25" inputmode="numeric">
        <span>min</span>
        <button class="small" id="setc">Set</button>
      </div>
    </div>
  </section>

  <section class="view" id="vBreak" aria-labelledby="bh" hidden>
    <h1 id="bh">Break it down</h1>
    <p class="sub">Stuck? Name the task. Get one small move.</p>
    <div class="panel">
      <form id="bform">
        <label for="task">What are you trying to start?</label>
        <input type="text" id="task" placeholder="e.g. Do my expense report" autocomplete="off">
        <div class="slider">
          <label for="lvl">How stuck?</label>
          <input type="range" id="lvl" min="1" max="5" value="3">
          <span class="lvl" id="lvlt">Pretty stuck</span>
        </div>
        <button class="primary" type="submit" id="bbtn">Break it down</button>
        <p class="status" id="status"></p>
      </form>
    </div>

    <div class="panel obj" id="card"></div>

    <div class="panel">
      <h2>Step log</h2>
      <ol id="list"></ol>
      <div class="add">
        <input type="text" id="addt" placeholder="Add a step yourself" autocomplete="off" aria-label="Add a step">
        <button id="addb">Add</button>
      </div>
      <div class="row" style="justify-content:flex-start;margin-top:12px"><button class="small" id="clear">Clear all</button></div>
      <p class="note" id="exnote">Example steps shown. Type your own task above to replace them.</p>
    </div>
  </section>
</main>

<script>
{
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const store={get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
const calm=matchMedia('(prefers-reduced-motion:reduce)').matches;

/* ---------- Pages ---------- */
function route(){
  const b=location.hash==='#breakdown';
  $('#vTimer').hidden=b;$('#vBreak').hidden=!b;
  $('#tabT').toggleAttribute('aria-current',!b);$('#tabB').toggleAttribute('aria-current',b);
  if(!b)$('#tabT').setAttribute('aria-current','page');else $('#tabB').setAttribute('aria-current','page');
}
function go(name){if(location.hash!=='#'+name)location.hash=name;route();window.scrollTo({top:0,behavior:calm?'auto':'smooth'})}
addEventListener('hashchange',route);
$('#tabT').addEventListener('click',e=>{e.preventDefault();go('timer')});
$('#tabB').addEventListener('click',e=>{e.preventDefault();go('breakdown')});
route();

/* ---------- Timer ---------- */
let total=25*60,remain=total,endAt=0,running=false,iv=null,actx=null;
const wedge=$('#wedge'),face=$('#face');
let t='';
for(let i=0;i<60;i++){
  const a=i*6*Math.PI/180,big=i%5===0,r1=big?82:88,r2=94;
  const p=r=>[(100+r*Math.sin(a)).toFixed(2),(100-r*Math.cos(a)).toFixed(2)];
  const [x1,y1]=p(r1),[x2,y2]=p(r2);
  t+=`<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${big?'#c6ff00':'#4a525a'}" stroke-opacity="${big?.8:1}" stroke-width="${big?1.8:.8}"/>`;
  if(big){const [lx,ly]=p(103);t+=`<text x="${lx}" y="${(+ly+3.5).toFixed(2)}" text-anchor="middle" font-size="10" font-weight="700" fill="#8a929a" font-family="Chakra Petch,sans-serif">${String(i).padStart(2,'0')}</text>`}
}
$('#ticks').innerHTML=t;

const fmt=s=>{s=Math.max(0,Math.ceil(s));const h=Math.floor(s/3600),m=Math.floor(s%3600/60),x=s%60;return (h?h+':'+String(m).padStart(2,'0'):String(m).padStart(2,'0'))+':'+String(x).padStart(2,'0')};
function render(){
  const max=Math.max(3600,total),f=Math.min(1,remain/max),r=80,R=34;
  const pt=(rad,a)=>`${(100+rad*Math.sin(a)).toFixed(2)},${(100-rad*Math.cos(a)).toFixed(2)}`;
  if(f<=0)wedge.setAttribute('d','');
  else{const a=Math.min(f,.99999)*2*Math.PI,lg=f>.5?1:0;
    wedge.setAttribute('d',`M${pt(R,0)}L${pt(r,0)}A${r},${r} 0 ${lg} 1 ${pt(r,a)}L${pt(R,a)}A${R},${R} 0 ${lg} 0 ${pt(R,0)}Z`)}
  $('#readout').textContent=fmt(remain);
  $('#go').textContent=running?'Pause':(remain<total&&remain>0?'Resume':'Start');
  $('#miniT').textContent=running?fmt(remain):'';
  document.title=running?fmt(remain)+' · Launchpad':'Launchpad focus tools';
  document.querySelectorAll('#presets button').forEach(b=>b.classList.toggle('on',+b.dataset.m*60===total));
}
function audio(){try{actx=actx||new (window.AudioContext||window.webkitAudioContext)();actx.resume()}catch(e){}}
function chime(){
  if(actx){try{const n=actx.currentTime;for(let i=0;i<3;i++){const o=actx.createOscillator(),g=actx.createGain();o.type='square';o.frequency.value=i%2?660:990;o.connect(g);g.connect(actx.destination);const s=n+i*.45;g.gain.setValueAtTime(0,s);g.gain.linearRampToValueAtTime(.12,s+.02);g.gain.exponentialRampToValueAtTime(.001,s+.38);o.start(s);o.stop(s+.4)}}catch(e){}}
  try{navigator.vibrate&&navigator.vibrate([300,150,300,150,300])}catch(e){}
}
let label='',linked=null;
const showLinked=()=>{const ok=linked!==null&&st.steps[linked]&&!st.steps[linked].done;$('#linked').hidden=!ok};
const setLabel=s=>{label=s||'';$('#tlabel').innerHTML=label?'Objective: <b>'+esc(label)+'</b>':''};
function tick(){remain=Math.max(0,(endAt-Date.now())/1000);if(remain<=0)finish();render()}
function start(){if(remain<=0)remain=total;audio();face.classList.remove('done');endAt=Date.now()+remain*1000;running=true;clearInterval(iv);iv=setInterval(tick,250);render()}
function pause(){remain=Math.max(0,(endAt-Date.now())/1000);running=false;clearInterval(iv);render()}
function finish(){running=false;clearInterval(iv);remain=0;face.classList.add('done');chime();$('#tlabel').innerHTML='<b>Time\'s up.</b> Nice work.'}
function setTimer(min,lab,li){linked=li===undefined?null:li;running=false;clearInterval(iv);total=Math.round(min*60);remain=total;face.classList.remove('done');setLabel(lab);$('#mins').value=Math.round(min);store.set('lp.timer',{total});showLinked();render()}

$('#presets').innerHTML=[5,10,15,25,45].map(m=>`<button class="small" data-m="${m}">${m} min</button>`).join('');
$('#presets').addEventListener('click',e=>{const b=e.target.closest('button');if(b)setTimer(+b.dataset.m)});
$('#go').addEventListener('click',()=>running?pause():start());
$('#reset').addEventListener('click',()=>setTimer(total/60,label,linked===null?undefined:linked));
$('#lback').addEventListener('click',()=>go('breakdown'));
$('#ldone').addEventListener('click',()=>{const s=st.steps[linked];if(s){s.done=true;st.example=false;save();renderSteps()}pause();setTimer(total/60,'');go('breakdown')});
$('#setc').addEventListener('click',()=>setTimer(Math.min(240,Math.max(1,+$('#mins').value||25))));
const saved=store.get('lp.timer',null);if(saved&&saved.total){total=saved.total;remain=total;$('#mins').value=Math.round(total/60)}
render();

/* ---------- Breakdown ---------- */
const LV=['A little','Somewhat','Pretty stuck','Very stuck','Totally frozen'];
const EX={task:'Clean out the garage',example:true,steps:[
  {text:'Put on shoes and open the garage door',min:2,done:true},
  {text:'Grab three bags: keep, donate, trash',min:3,done:false},
  {text:'Clear only the shelf nearest the door',min:10,done:false},
  {text:'Carry the trash bag to the bin',min:2,done:false},
  {text:'Load the donate bag into the car',min:3,done:false}]};
let st=store.get('lp.steps',EX);
const save=()=>store.set('lp.steps',st);
const cur=()=>st.steps.findIndex(s=>!s.done);
$('#lvl').addEventListener('input',()=>$('#lvlt').textContent=LV[$('#lvl').value-1]);

function renderSteps(){
  const c=cur(),card=$('#card'),n=st.steps.length,d=st.steps.filter(s=>s.done).length;
  const bar=n?`<div class="bar"><i style="width:${Math.round(d/n*100)}%"></i></div>`:'';
  if(!n){card.className='panel obj empty';card.innerHTML='<p class="k">No objective</p><p class="now">Type a task above and hit Break it down.</p>'}
  else if(c<0){card.className='panel obj';card.innerHTML=`<p class="k">Mission complete <span>· ${d}/${n}</span></p>${bar}<p class="now">Every step done. That counts.</p>`}
  else{const s=st.steps[c];card.className='panel obj';card.innerHTML=`<p class="k">Current objective <span>· step ${c+1} of ${n}${st.task?' · '+esc(st.task):''}</span></p>${bar}<p class="now">${esc(s.text)}</p><div class="row"><button class="primary" data-a="done" data-i="${c}">Done</button><button data-a="time" data-i="${c}">Timer ${s.min} min</button><button data-a="split" data-i="${c}">Still too big</button></div>`}
  $('#list').innerHTML=st.steps.map((s,i)=>`<li class="${s.done?'done':''} ${i===c?'cur':''}"><button class="chk" data-a="done" data-i="${i}" aria-label="${s.done?'Mark not done':'Mark done'}">${s.done?'✓':''}</button><span class="txt"><button class="steptxt" data-a="time" data-i="${i}" title="Start timer for this step">${esc(s.text)}<small>${s.min} min</small></button></span><span class="acts"><button class="small" data-a="time" data-i="${i}">Timer</button><button class="small" data-a="del" data-i="${i}" aria-label="Delete step">✕</button></span></li>`).join('');
  $('#exnote').style.display=st.example?'':'none';
}
function act(e){
  const b=e.target.closest('[data-a]');if(!b)return;
  const i=+b.dataset.i,s=st.steps[i];if(!s)return;
  if(b.dataset.a==='done')s.done=!s.done;
  else if(b.dataset.a==='del')st.steps.splice(i,1);
  else if(b.dataset.a==='time'){setTimer(s.min,s.text,i);start();go('timer');return}
  else if(b.dataset.a==='split'){split(i);return}
  st.example=false;save();renderSteps();
}
$('#card').addEventListener('click',act);$('#list').addEventListener('click',act);
$('#addb').addEventListener('click',()=>{const v=$('#addt').value.trim();if(!v)return;if(st.example)st={task:'',steps:[],example:false};st.steps.push({text:v,min:5,done:false});$('#addt').value='';save();renderSteps()});
$('#addt').addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();$('#addb').click()}});
$('#clear').addEventListener('click',()=>{st={task:'',steps:[],example:false};save();renderSteps()});

const NA='AI breakdown is not available in this view. You can still add steps by hand.';
const status=(m,busy)=>{const s=$('#status');s.textContent=m;s.classList.toggle('busy',!!busy)};
let sample=null,busy=false;
const ready=(window.claude&&claude.use)?claude.use('sample').then(s=>{sample=s;if(!s)status(NA)}).catch(()=>{}):Promise.resolve();
if(!window.claude)status(NA);

function prompt(task,level,parent){
  const n=[3,4,5,6,8][level-1];
  return `You help an adult with ADHD who is stuck and cannot get started. Stuck level: ${level} of 5 ("${LV[level-1]}").
${parent?`They were working on "${parent}" and this step still feels too big: "${task}". Break just this step into smaller steps.`:`Task: "${task}".`}
Write about ${n} steps. Rules: the first step must be a tiny physical action that takes under 2 minutes and needs no decision (stand up, open the file, get the bag). Every step starts with a verb, is concrete and visible, under 12 words, no advice or pep talk. The more stuck they are, the smaller each step. Estimate whole minutes per step (1-30).
Reply with only JSON: {"steps":[{"text":"...","min":2}]}`;
}
async function ask(task,level,parent){
  await ready;
  if(!sample){status(NA);return null}
  busy=true;$('#bbtn').disabled=true;status('Breaking it into small pieces…',true);
  try{
    const v=await sample.json(prompt(task,level,parent),{modelTier:'quick'});
    const steps=(v&&Array.isArray(v.steps)?v.steps:[]).filter(s=>s&&s.text).map(s=>({text:String(s.text).slice(0,140),min:Math.min(60,Math.max(1,Math.round(+s.min)||5)),done:false}));
    if(!steps.length)throw {message:'No steps came back'};
    status('');return steps;
  }catch(err){
    status(err&&err.code==='rate_limited'?'Too many requests just now. Wait a minute and try again.':err&&err.code==='not_granted'?'AI breakdown was not allowed. You can still add steps by hand.':'That did not work. Try again, or add steps by hand.');
    return null;
  }finally{busy=false;$('#bbtn').disabled=false}
}
$('#bform').addEventListener('submit',async e=>{
  e.preventDefault();if(busy)return;const task=$('#task').value.trim();
  if(!task){status('Type the task first. Messy wording is fine.');$('#task').focus();return}
  const steps=await ask(task,+$('#lvl').value);
  if(steps){st={task,steps,example:false};save();renderSteps()}
});
async function split(i){
  if(busy)return;const s=st.steps[i];
  const steps=await ask(s.text,Math.min(5,+$('#lvl').value+1),st.task);
  if(steps){st.steps.splice(i,1,...steps);st.example=false;save();renderSteps()}
}
renderSteps();
}
</script>
